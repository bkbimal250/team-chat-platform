[project]
name = "organization-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3", "djangorestframework>=3.16,<3.17",
  "psycopg[binary]>=3.2,<4", "dj-database-url>=3,<4",
  "django-filter>=25,<26", "drf-spectacular>=0.28,<0.30",
  "pika>=1.3,<2", "pydantic>=2.11,<3", "gunicorn>=23,<24",
  "django-cors-headers>=4.7,<5", "whitenoise>=6.9,<7",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.11,<1", "pytest-cov>=6,<8"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires live RabbitMQ and PostgreSQL"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
