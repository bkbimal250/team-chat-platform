openapi: 3.0.3
info:
  title: Organization Service
  version: 1.0.0
  description: Phase 1 tenant administration. Production product access is fail-closed
    pending verified Identity integration. All operations require the documented permission
    and trusted tenant context. Lists use cursor pagination.
paths:
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
        Required permission: `none`. Tenant-scoped identifiers return 404 outside the current organization. Errors use `error.code`, `error.message`, `error.details`, `error.correlation_id`.
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
