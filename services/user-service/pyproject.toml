[project]
name = "user-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<2.1", "asyncpg>=0.30,<1", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3", "PyJWT[crypto]>=2.10,<3", "aio-pika>=9.5,<10"]
[dependency-groups]
dev = ["ruff>=0.11,<1", "pytest>=8,<10", "httpx>=0.28,<1"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
[tool.pytest.ini_options]
pythonpath = ["."]
