[project]
name = "conversation-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<2.1", "asyncpg>=0.30,<1", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "redis>=5.2,<7", "pika>=1.3,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1", "ruff>=0.11,<1", "aiosqlite>=0.21,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
