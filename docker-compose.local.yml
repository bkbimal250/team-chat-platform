name: globalchat-local
services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run scripts/local/dev.py prepare first}
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: globalchat_local
      RABBITMQ_DEFAULT_PASS: ${LOCAL_RABBIT_PASSWORD:?Run scripts/local/dev.py prepare first}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitmq:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  postgres:
  redis:
  rabbitmq:
